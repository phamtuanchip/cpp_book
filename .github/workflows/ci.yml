name: Code samples
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Compile and run every example
        run: |
          set -e
          for f in code/chapter-*/*.cpp; do
            echo "== $f"
            g++ -std=c++20 -Wall -Wextra -o /tmp/a.out "$f"
            /tmp/a.out > "${f%.cpp}.runout.txt"
          done
      - name: Check book sources
        run: node tools/build.js check
      # May tac gia bi chan chay g++ (Application Control policy), nen output that duoc sinh o day
      # va tai ve qua artifact de commit vao code/chapter-*/*.runout.txt.
      - name: Upload real example outputs
        uses: actions/upload-artifact@v4
        with:
          name: runout
          path: code/chapter-*/*.runout.txt
          if-no-files-found: error
